<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hgff</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .project-name {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #58a6ff 0%, #a371f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #58a6ff, #a371f7);
      border-radius: 999px;
      margin: 1.5rem auto;
    }

    .description {
      color: #8b949e;
      font-size: 1rem;
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 2rem;
    }

    .repo-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 0.85rem 1.4rem;
      width: fit-content;
      margin: 0 auto;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: default;
    }

    .repo-section:hover {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
    }

    .repo-icon {
      width: 20px;
      height: 20px;
      fill: #8b949e;
      flex-shrink: 0;
    }

    .repo-label {
      font-size: 0.78rem;
      color: #8b949e;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .repo-name {
      font-size: 1rem;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 0.01em;
    }

    .repo-separator {
      color: #30363d;
      font-size: 1rem;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #21262d;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e6edf3;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    footer {
      margin-top: 1rem;
      text-align: center;
      color: #484f58;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      padding-bottom: 2rem;
    }

    footer span {
      color: #8b949e;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .project-name {
        font-size: 2.6rem;
      }
      .card {
        padding: 2rem 1.5rem;
      }
      .stats-row {
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="badge">&#x2726; Open Source Project</div>

    <div class="card">
      <div class="project-name">hgff</div>

      <div class="description">
        A modern, lightweight project built for developers who value simplicity, performance, and clean architecture.
      </div>

      <div class="divider"></div>

      <div class="repo-section">
        <svg class="repo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

            C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729
            1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305
            3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93
            0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176
            0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405
            1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23
            3.285-1.23.645 1.653.24 2.873.12 3.176.765.84
            1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475
            5.92.42.36.81 1.096.81 2.22 0 1.606-.015
            2.896-.015 3.286 0 .315.21.69.825.57

        </svg>
        <span class="repo-label">Repo</span>
        <span class="repo-separator">/</span>
        <span class="repo-name">Jffygg</span>
      </div>

      <div class="stats-row">
        <div class="stat">
          <span class="stat-value">&#9733; Stars</span>
          <span class="stat-label">Open Source</span>
        </div>
        <div class="stat">
          <span class="stat-value">&#x2193; Forks</span>
          <span class="stat-label">Contribute</span>
        </div>
        <div class="stat">
          <span class="stat-value">&#x1F4E6; Releases</span>
          <span class="stat-label">Stable Build</span>
        </div>
      </div>
    </div>

    <footer>
      Developed by <span>Royal Bengal AI</span>
    </footer>

  </div>

</body>
</html>
